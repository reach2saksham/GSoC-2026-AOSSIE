  <style>
    .viz { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #8a8984; --grid: #e6e5e1;
           --s1: #2a78d6; --s2: #eb6834; --s3: #8a8984; }
    @media (prefers-color-scheme: dark) {
      .viz { --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #8f8e88; --grid: #2e2e2c;
             --s1: #3987e5; --s2: #d95926; --s3: #8f8e88; }
    }
    .bg { fill: var(--surface); }
    text { font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: var(--ink2); font-size: 13px; }
    .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 12px; }
    .label { fill: var(--ink); }
    .value { fill: var(--ink2); font-size: 12px; font-variant-numeric: tabular-nums; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .s1 { fill: var(--s1); } .s2 { fill: var(--s2); }
    .ring1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
    .ring2 { fill: none; stroke: var(--s2); stroke-width: 2; }
    .ring3 { fill: none; stroke: var(--s3); stroke-width: 2; stroke-dasharray: 2 2; }
  </style>
